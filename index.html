<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable desativam o zoom automático do iOS ao
         focar inputs; viewport-fit=cover habilita as safe areas (notch). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#687047" />
    <!-- PWA no iOS: tela cheia e status bar integrada ao tema. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Libro" />
    <meta
      name="description"
      content="Clubinho do Libro: o clube de leitura aconchegante do nosso grupo."
    />
    <title>Clubinho do Libro</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
