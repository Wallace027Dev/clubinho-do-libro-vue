<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable desativam o zoom automático do iOS ao
         focar inputs; viewport-fit=cover habilita as safe areas (notch). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#556034" />
    <!-- Favicon do navegador: mesma arte do ícone do PWA. -->
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <!-- Fontes do tema "Biblioteca acolhedora": serif literária para
         títulos (Libre Caslon Text) e Karla para o corpo. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- PWA no iOS: tela cheia e status bar integrada ao tema. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Libro" />
    <meta
      name="description"
      content="Clubinho do Libro: o clube de leitura aconchegante do nosso grupo."
    />
    <title>Clubinho do Libro</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
