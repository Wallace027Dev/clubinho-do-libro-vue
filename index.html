<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable desativam o zoom automático do iOS ao
         focar inputs; viewport-fit=cover habilita as safe areas (notch). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#004ba9" />
    <!-- Favicon do navegador: mesma arte do ícone do PWA. -->
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg" />
    <!-- Identidade "clubin. do libro": títulos em Courier New (fonte de
         sistema, sem download); corpo em Open Sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- PWA no iOS: tela cheia e status bar integrada ao tema. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Clubin" />
    <meta
      name="description"
      content="Clubin do Libro: o clube de leitura do nosso grupo — clássicos e tal."
    />
    <title>Clubin do Libro</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
